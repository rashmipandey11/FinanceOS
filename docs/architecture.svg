<svg viewBox="0 0 1440 1120" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="1120" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="36" font-size="22" font-weight="700" fill="#111827">FinanceOS — Solution Architecture</text>
  <text x="30" y="58" font-size="14" fill="#6b7280">Process 1: Invoice Exception Triage (built) · Processes 2 &amp; 3 planned, not yet implemented</text>

  <!-- ============ FRONTEND LAYER ============ -->
  <rect x="30" y="80" width="1380" height="130" rx="10" fill="#eaf1ff" stroke="#1a56db" stroke-width="1.5"/>
  <text x="50" y="105" font-size="14" font-weight="700" fill="#1a56db">FRONTEND — React + Vite (browser, localhost:5173)</text>

  <g font-size="12" fill="#1a56db">
    <rect x="50" y="118" width="190" height="72" rx="6" fill="#ffffff" stroke="#1a56db"/>
    <text x="62" y="138" font-weight="600">Login</text>
    <text x="62" y="156" fill="#374151">JWT session, seeded demo user</text>

    <rect x="255" y="118" width="230" height="72" rx="6" fill="#ffffff" stroke="#1a56db"/>
    <text x="267" y="138" font-weight="600">New Invoice</text>
    <text x="267" y="156" fill="#374151">Manual entry / JSON paste /</text>
    <text x="267" y="172" fill="#374151">"Load sample batch" (15 invoices)</text>

    <rect x="500" y="118" width="230" height="72" rx="6" fill="#ffffff" stroke="#1a56db"/>
    <text x="512" y="138" font-weight="600">Invoice List / Detail</text>
    <text x="512" y="156" fill="#374151">Discrepancy flags, AI rationale,</text>
    <text x="512" y="172" fill="#374151">approve / escalate / reject override</text>

    <rect x="745" y="118" width="200" height="72" rx="6" fill="#ffffff" stroke="#1a56db"/>
    <text x="757" y="138" font-weight="600">Dashboard</text>
    <text x="757" y="156" fill="#374151">Exception volume, override rate,</text>
    <text x="757" y="172" fill="#374151">avg. resolution time</text>

    <rect x="960" y="118" width="430" height="72" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5,3"/>
    <text x="972" y="138" font-weight="600" fill="#6b7280">Planned (not built): Budget Variance UI,</text>
    <text x="972" y="156" fill="#6b7280">Vendor Onboarding + Master View</text>
  </g>

  <!-- Arrow Frontend -> API -->
  <line x1="720" y1="210" x2="720" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="732" y="230" font-size="12" fill="#374151">HTTPS (JSON, Bearer JWT)</text>

  <!-- ============ API LAYER ============ -->
  <rect x="30" y="250" width="1380" height="120" rx="10" fill="#e9f7ee" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="50" y="275" font-size="14" font-weight="700" fill="#1a7f37">BACKEND API — Express + TypeScript (localhost:4000)</text>

  <g font-size="12" fill="#1a7f37">
    <rect x="50" y="288" width="190" height="66" rx="6" fill="#ffffff" stroke="#1a7f37"/>
    <text x="62" y="308" font-weight="600">POST /auth/login</text>
    <text x="62" y="326" fill="#374151">bcrypt compare → sign JWT</text>

    <rect x="255" y="288" width="260" height="66" rx="6" fill="#ffffff" stroke="#1a7f37"/>
    <text x="267" y="308" font-weight="600">/invoices (GET, POST,</text>
    <text x="267" y="324" font-weight="600">PATCH /:id/override)</text>
    <text x="267" y="340" fill="#374151">requireAuth JWT middleware</text>

    <rect x="530" y="288" width="200" height="66" rx="6" fill="#ffffff" stroke="#1a7f37"/>
    <text x="542" y="308" font-weight="600">/purchase-orders</text>
    <text x="542" y="326" fill="#374151">read-only PO register</text>

    <rect x="745" y="288" width="200" height="66" rx="6" fill="#ffffff" stroke="#1a7f37"/>
    <text x="757" y="308" font-weight="600">/dashboard/summary</text>
    <text x="757" y="326" fill="#374151">aggregates invoices + audit_log</text>

    <rect x="960" y="288" width="430" height="66" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5,3"/>
    <text x="972" y="308" font-weight="600" fill="#6b7280">Planned: /budget-actuals, /vendors</text>
    <text x="972" y="326" fill="#6b7280">(screening endpoints for Processes 2 &amp; 3)</text>
  </g>

  <!-- Arrows API -> Services -->
  <line x1="380" y1="370" x2="380" y2="400" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845" y1="370" x2="845" y2="400" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ SERVICES LAYER ============ -->
  <rect x="30" y="408" width="1000" height="150" rx="10" fill="#fdf2d9" stroke="#9a6700" stroke-width="1.5"/>
  <text x="50" y="432" font-size="14" font-weight="700" fill="#9a6700">SERVICES — invoice triage pipeline (server/src/services)</text>

  <g font-size="12" fill="#9a6700">
    <rect x="50" y="446" width="290" height="96" rx="6" fill="#ffffff" stroke="#9a6700"/>
    <text x="62" y="466" font-weight="600">① matching.ts — deterministic</text>
    <text x="62" y="484" fill="#374151">Looks up PO + vendor tables, flags:</text>
    <text x="62" y="500" fill="#374151">missing/unknown PO, closed PO,</text>
    <text x="62" y="516" fill="#374151">duplicate, over/under amount.</text>
    <text x="62" y="532" fill="#374151">Source of truth for facts — never the LLM.</text>

    <rect x="360" y="446" width="330" height="96" rx="6" fill="#ffffff" stroke="#9a6700"/>
    <text x="372" y="466" font-weight="600">② llmTriage.ts — reasoning</text>
    <text x="372" y="484" fill="#374151">In: invoice + matched PO + flags</text>
    <text x="372" y="500" fill="#374151">(from /prompts/invoice_triage.md)</text>
    <text x="372" y="516" fill="#374151">Out: JSON {recommendation, rationale}</text>
    <text x="372" y="532" fill="#374151">10s timeout, 1 retry, then rule-based fallback</text>

    <rect x="710" y="446" width="290" height="96" rx="6" fill="#ffffff" stroke="#9a6700"/>
    <text x="722" y="466" font-weight="600">③ auditLog.ts</text>
    <text x="722" y="484" fill="#374151">Writes one row per AI triage and per</text>
    <text x="722" y="500" fill="#374151">human confirm/override (old → new),</text>
    <text x="722" y="516" fill="#374151">powering the override-rate metric.</text>
  </g>

  <!-- Arrow Services -> Claude (routed above the sub-boxes so it doesn't cross auditLog.ts) -->
  <line x1="705" y1="420" x2="1055" y2="420" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="416" font-size="11" fill="#374151">④ system+user prompt</text>
  <line x1="1055" y1="437" x2="705" y2="437" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="433" font-size="11" fill="#374151">⑤ JSON recommendation + rationale (or timeout/error)</text>

  <!-- ============ EXTERNAL LLM ============ -->
  <rect x="1060" y="408" width="350" height="150" rx="10" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1080" y="432" font-size="14" font-weight="700" fill="#c2410c">EXTERNAL — Anthropic Claude API</text>
  <text x="1080" y="456" font-size="12" fill="#374151">Model: claude-sonnet-4-5</text>
  <text x="1080" y="474" font-size="12" fill="#374151">Structured JSON output, parsed +</text>
  <text x="1080" y="490" font-size="12" fill="#374151">validated with zod before storing.</text>
  <text x="1080" y="512" font-size="12" fill="#374151">On failure (timeout/rate limit/</text>
  <text x="1080" y="528" font-size="12" fill="#374151">bad schema): fall back to ①'s rule-based</text>
  <text x="1080" y="544" font-size="12" fill="#374151">suggestion; UI shows a fallback banner.</text>

  <!-- Arrow Services -> DB -->
  <line x1="200" y1="558" x2="200" y2="590" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="580" font-size="11" fill="#374151">⑥ read PO/vendor, ⑦ write invoice + audit_log</text>

  <!-- ============ DATABASE LAYER ============ -->
  <rect x="30" y="598" width="1000" height="220" rx="10" fill="#f3e8fd" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="50" y="622" font-size="14" font-weight="700" fill="#7c3aed">DATABASE — SQLite via Prisma (server/prisma, local file dev.db)</text>

  <g font-size="12" fill="#7c3aed">
    <rect x="50" y="636" width="160" height="60" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="62" y="656" font-weight="600">users</text>
    <text x="62" y="674" fill="#374151">id, email, role</text>

    <rect x="225" y="636" width="160" height="60" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="237" y="656" font-weight="600">vendors</text>
    <text x="237" y="674" fill="#374151">id, name (minimal)</text>

    <rect x="400" y="636" width="220" height="60" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="412" y="656" font-weight="600">purchase_orders</text>
    <text x="412" y="674" fill="#374151">po_number, vendor, amount,</text>
    <text x="412" y="690" fill="#374151">cost_centre, status</text>

    <rect x="635" y="636" width="360" height="90" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="647" y="656" font-weight="600">invoices</text>
    <text x="647" y="674" fill="#374151">vendor, po_number (nullable — not FK,</text>
    <text x="647" y="690" fill="#374151">exceptions are the point), amount, status,</text>
    <text x="647" y="706" fill="#374151">ai_recommendation, ai_rationale, ai_fallback,</text>
    <text x="647" y="722" fill="#374151">human_override, resolved_at</text>

    <rect x="50" y="712" width="535" height="60" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="62" y="732" font-weight="600">audit_log</text>
    <text x="62" y="750" fill="#374151">user_id, entity_type, entity_id, action, old_value, new_value, timestamp</text>

    <text x="50" y="800" font-size="11" fill="#6b7280">po_number on invoices is a plain string, not a foreign key: an unmatched/missing PO is an expected exception case, not a data error.</text>
  </g>

  <!-- ============ PLANNED / NOT BUILT ============ -->
  <rect x="1060" y="598" width="350" height="220" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1080" y="622" font-size="14" font-weight="700" fill="#6b7280">PLANNED — not yet implemented</text>
  <text x="1080" y="648" font-size="12" fill="#6b7280">Process 2 — Budget Variance Narrative</text>
  <text x="1080" y="666" font-size="12" fill="#6b7280">  + budget_actuals table</text>
  <text x="1080" y="690" font-size="12" fill="#6b7280">Process 3 — Vendor Risk Screener</text>
  <text x="1080" y="708" font-size="12" fill="#6b7280">  + vendors extended with abn, bank_account,</text>
  <text x="1080" y="724" font-size="12" fill="#6b7280">    risk_tier, onboarding_status</text>
  <text x="1080" y="750" font-size="12" fill="#6b7280">PDF invoice upload/OCR (JSON + manual</text>
  <text x="1080" y="766" font-size="12" fill="#6b7280">  entry cover Process 1 today)</text>
  <text x="1080" y="792" font-size="12" fill="#6b7280">No queue/async layer — LLM call is</text>
  <text x="1080" y="808" font-size="12" fill="#6b7280">  synchronous, fine at demo volume</text>

  <!-- Auth note -->
  <rect x="30" y="840" width="1380" height="60" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="862" font-size="12" font-weight="600" fill="#374151">Auth</text>
  <text x="50" y="880" font-size="12" fill="#6b7280">JWT session token (8h expiry), one seeded demo user, bcrypt password hashing. No OAuth/SSO — explicitly out of scope for this assessment.</text>

  <!-- Flow legend -->
  <rect x="30" y="915" width="1380" height="185" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="940" font-size="13" font-weight="700" fill="#111827">Process 1 data flow (numbered above)</text>
  <text x="50" y="962" font-size="12" fill="#374151">1. Analyst submits an invoice (manual form, pasted/uploaded JSON, or the sample batch) → POST /api/invoices</text>
  <text x="50" y="982" font-size="12" fill="#374151">2. matching.ts reads purchase_orders, vendors and prior invoices to deterministically flag discrepancies</text>
  <text x="50" y="1002" font-size="12" fill="#374151">3. llmTriage.ts sends the invoice + matched PO + flags to Claude, asking for a JSON {recommendation, rationale}</text>
  <text x="50" y="1022" font-size="12" fill="#374151">4. On success: response is schema-validated and stored. On timeout/error/bad schema: retry once, then fall back to the</text>
  <text x="50" y="1040" font-size="12" fill="#374151">   rule-based suggestion from step 2 and flag ai_fallback = true (shown as a banner in the UI, not a crash)</text>
  <text x="50" y="1060" font-size="12" fill="#374151">5. Invoice + audit_log rows are written; analyst reviews in Invoice Detail and approves/escalates/rejects</text>
  <text x="50" y="1080" font-size="12" fill="#374151">6. The override (PATCH /invoices/:id/override) updates status + resolved_at and writes a second audit_log row</text>
  <text x="50" y="1100" font-size="12" fill="#374151">7. Dashboard aggregates invoices + audit_log into exception volume, AI-vs-human override rate, avg. resolution time</text>
</svg>
